<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<title>FDE Glossary</title>
<style>
  :root{
    --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e9e7; --ink:#1a232b; --muted:#5c6b73;
    --border:#d3dbdd; --accent:#b8681f; --accent-ink:#fff8f0; --accent2:#256d87; --good:#3f7d52;
    --font-display: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161c; --surface:#171f28; --surface-2:#1c2530; --ink:#e6ecef; --muted:#93a3ac;
      --border:#2a3540; --accent:#e0964e; --accent-ink:#171208; --accent2:#6db8d6; --good:#63b37c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161c; --surface:#171f28; --surface-2:#1c2530; --ink:#e6ecef; --muted:#93a3ac;
    --border:#2a3540; --accent:#e0964e; --accent-ink:#171208; --accent2:#6db8d6; --good:#63b37c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 31px, color-mix(in srgb, var(--border) 55%, transparent) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, color-mix(in srgb, var(--border) 55%, transparent) 32px),
      var(--bg);
    color:var(--ink); font-family:var(--font-body); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent2);}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 24px 100px;}
  .backlink{font-family:var(--font-mono); font-size:12px; text-decoration:none; color:var(--muted); display:inline-flex; gap:6px;}
  .backlink:hover{color:var(--accent2);}
  header.masthead{border-bottom:1px solid var(--border); padding-bottom:24px; margin:18px 0 28px;}
  .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent2); display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:""; width:20px; height:1px; background:var(--accent2); display:inline-block;}
  h1{font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4.5vw,38px); margin:10px 0 8px; text-wrap:balance; letter-spacing:-0.01em;}
  .sub{color:var(--muted); font-size:15px; max-width:60ch;}

  .controls{position:sticky; top:0; background:var(--bg); padding:14px 0; z-index:10; border-bottom:1px solid var(--border); margin-bottom:20px;}
  .search-box{
    width:100%; font-family:var(--font-mono); font-size:14px; padding:10px 14px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); border-radius:2px; margin-bottom:10px;
  }
  .filter-row{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-chip{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:5px 11px;
    border-radius:2px; cursor:pointer;
  }
  .filter-chip:hover{border-color:var(--accent2);}
  .filter-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .count-label{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-bottom:14px;}

  .term-grid{display:flex; flex-direction:column; gap:0;}
  .term{border-bottom:1px solid var(--border); padding:16px 0;}
  .term:last-child{border-bottom:none;}
  .term-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .term-name{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .term-track{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent2); border:1px solid var(--accent2); padding:2px 8px; border-radius:2px; white-space:nowrap;}
  .term-def{font-size:14px; margin-top:6px; color:var(--ink);}
  .term-day{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:6px;}
  .no-results{font-family:var(--font-mono); font-size:13px; color:var(--muted); padding:30px 0; text-align:center;}

  .nav-footer{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:18px; margin-top:20px; font-family:var(--font-mono); font-size:12px;}
  .nav-footer a{text-decoration:none; border:1px solid var(--border); padding:7px 12px; border-radius:2px;}
  .nav-footer a:hover{border-color:var(--accent2);}

  .top-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .lang-switch{display:flex; gap:4px; font-family:var(--font-mono); font-size:11px;}
  .lang-switch a, .lang-switch span{padding:3px 9px; border:1px solid var(--border); border-radius:2px; text-decoration:none; color:var(--muted); letter-spacing:.04em;}
  .lang-switch .lang-current{color:var(--accent); border-color:var(--accent); font-weight:600;}
  .lang-switch a:hover{border-color:var(--accent2); color:var(--accent2);}
</style>
</head>
<body>


<div class="wrap">
  <div class="top-bar"><a class="backlink" href="../index.html">&larr; Back to hub</a><div class="lang-switch"><a href="../glosario.html">ES</a><span class="lang-current">EN</span></div></div>

  <header class="masthead">
    <div class="eyebrow">Reference · AI Agent Engineering Bootcamp</div>
    <h1>Glossary</h1>
    <p class="sub">Key terms from all 14 days, on a single filterable page. Use it for quick review, not as first-read material.</p>
  </header>

  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search a term... (e.g., saga, oauth, rag)">
    <div class="filter-row" id="filterRow"></div>
  </div>

  <div class="count-label" id="countLabel"></div>
  <div class="term-grid" id="termGrid"></div>
  <div class="no-results" id="noResults" style="display:none;">No results — try another term.</div>

  <div class="nav-footer">
    <a href="../index.html">&larr; Hub</a>
    <span>Glossary · 40+ terms</span>
  </div>
</div>

<script>
  const TERMS = [
    {t:"LLM", track:"AI Agents", day:"Day 01", def:"A model that predicts, token by token, the most likely text given a context. No memory between calls — it's stateless."},
    {t:"Prompting", track:"AI Agents", day:"Day 01", def:"System prompt = behavior contract (config). User prompt = the specific request."},
    {t:"Structured Outputs", track:"AI Agents", day:"Day 01", def:"Forcing the model to return output matching a validatable schema, instead of free text."},
    {t:"Function / Tool Calling", track:"AI Agents", day:"Day 01", def:"The LLM proposes {name, arguments}; the backend validates and decides whether to execute. The model never runs code directly."},
    {t:"Agent", track:"AI Agents", day:"Day 01", def:"An LLM inside a control loop: decides, acts (tool), observes, repeats until it answers."},
    {t:"RAG", track:"AI Agents", day:"Day 01", def:"Retrieval-Augmented Generation: looking up knowledge at runtime instead of training it into the model's weights."},
    {t:"Embeddings", track:"AI Agents", day:"Day 01", def:"A vector representation of text where distance reflects semantic similarity."},
    {t:"Vector Database", track:"AI Agents", day:"Day 01", def:"An index optimized for nearest-neighbor search over embeddings."},
    {t:"Context Window", track:"AI Agents", day:"Day 01", def:"A request's token budget: system prompt + history + RAG + tool outputs compete for that space."},
    {t:"Hallucination", track:"AI Agents", day:"Day 01", def:"The model generates plausible but false text, with no error signal — the most dangerous failure mode."},
    {t:"Guardrails", track:"AI Agents", day:"Day 01", def:"Input/output validation middleware around the model: filters, schema, action limits."},
    {t:"Agent Runtime", track:"AI Agents", day:"Day 02", def:"The process that orchestrates the loop: builds context, calls the LLM, executes tools, decides the next step."},
    {t:"Single-agent vs Multi-agent", track:"AI Agents", day:"Day 02", def:"One agent with several tools vs. several specialized agents. Multi-agent is justified by heterogeneous domains with different security scopes."},
    {t:"OAuth2 / OIDC", track:"Integration", day:"Days 03-04", def:"OAuth2: delegated authorization. OIDC: an identity layer on top of OAuth2. The token's scope should reflect exactly the user's permission."},
    {t:"API Gateway", track:"Integration", day:"Day 03", def:"Central chokepoint for auth, rate limiting, and logging across all of the agent's tool calls."},
    {t:"Prompt Injection", track:"Security", day:"Day 04", def:"Malicious instructions hidden in external content (email, web) that try to hijack the agent's behavior."},
    {t:"Excessive Agency", track:"Security", day:"Day 04", def:"Giving the agent more permissions than the task requires. Prevented with architecture, not the prompt."},
    {t:"RBAC", track:"Security", day:"Day 04", def:"Available tools depend on the role of the user the agent acts on behalf of."},
    {t:"Human-in-the-loop", track:"Security", day:"Day 04", def:"An explicit human-approval checkpoint for irreversible or high-impact actions."},
    {t:"Idempotency", track:"Reliability", day:"Days 05, 07", def:"An operation can run more than once without changing the outcome beyond the first execution — key with retries."},
    {t:"Circuit Breaker", track:"Reliability", day:"Day 05", def:"Cuts calls to a repeatedly failing dependency, forcing a quick fallback."},
    {t:"Golden Set", track:"Reliability", day:"Day 05", def:"A fixed set of test cases to catch an agent's regressions before deploy."},
    {t:"CAP Theorem", track:"Distributed Systems", day:"Day 07", def:"During a network partition, you have to choose between consistency and availability."},
    {t:"Saga", track:"Distributed Systems", day:"Day 07", def:"A pattern for multi-step actions without a single ACID transaction: each step has a compensating action if something fails later."},
    {t:"Outbox Pattern", track:"Distributed Systems", day:"Day 07", def:"Writing an event in the same local transaction as the state change, to publish it reliably afterward."},
    {t:"Exactly-once vs At-least-once", track:"Distributed Systems", day:"Day 07", def:"Real exactly-once is nearly impossible at the network level; it's simulated with at-least-once + idempotency."},
    {t:"Distributed Lock", track:"Distributed Systems", day:"Day 07", def:"Prevents two concurrent executions (e.g., two channels) from modifying the same resource at the same time."},
    {t:"Lambda vs ECS", track:"Cloud (AWS)", day:"Day 08", def:"Lambda for short, stateless tools. ECS/EKS for the long-running Agent Runtime with persistent connections."},
    {t:"SQS vs Kafka", track:"Cloud (AWS)", day:"Day 08", def:"SQS for point-to-point work distribution. Kafka for multiple independent consumers of the same event."},
    {t:"Step Functions", track:"Cloud (AWS)", day:"Day 08", def:"A sequence orchestrator with retry and per-step error handling — the natural fit to implement a Saga."},
    {t:"DynamoDB vs RDS", track:"Cloud (AWS)", day:"Day 08", def:"DynamoDB for conversation state (key-value, low latency). RDS for relational business data with joins."},
    {t:"Composition Case", track:"Interview Skills", day:"Day 09", def:"An interview case with an ambiguous business problem; it evaluates problem decomposition, not technical depth."},
    {t:"System Design (16 steps)", track:"Interview Skills", day:"Day 06", def:"Framework: Clarify → Users → Objectives → Requirements → Constraints → Architecture → ... → Rollout."},
    {t:"Barge-in", track:"Voice", day:"Day 10", def:"The user's ability to interrupt the agent while it's speaking — critical in voice channels, irrelevant in chat."},
    {t:"CDRT Framework", track:"Communication", day:"Day 12", def:"Context → Decision → Reason → Trade-off → Result. A mold for explaining any technical decision in 60-90s."},
    {t:"STAR + Architecture Context", track:"Behavioral", day:"Day 13", def:"Situation, Task, Action, Result, plus the specific technical/architectural detail of the decision made."},
    {t:"MVP", track:"Product Thinking", day:"Day 11", def:"The highest-value, lowest-risk subset of scope that ships first, before committing to full scope."},
    {t:"Least Privilege", track:"Security", day:"Days 04, 08", def:"Every tool/role has exactly the minimum permission necessary for its function — nothing more."},
    {t:"Backpressure", track:"Distributed Systems", day:"Day 07", def:"The system tells the orchestrator to 'slow down' when overloaded, instead of falling over."},
    {t:"Model Fallback", track:"Reliability", day:"Day 05", def:"If the primary model fails or degrades, the architecture allows falling back to a secondary model/provider."},
  ];

  const tracks = [...new Set(TERMS.map(x => x.track))];
  let activeFilter = null;

  const filterRow = document.getElementById('filterRow');
  const allChip = document.createElement('button');
  allChip.className = 'filter-chip active';
  allChip.textContent = 'All';
  allChip.addEventListener('click', () => setFilter(null));
  filterRow.appendChild(allChip);
  tracks.forEach(tr => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.textContent = tr;
    chip.addEventListener('click', () => setFilter(tr));
    filterRow.appendChild(chip);
  });

  function setFilter(track){
    activeFilter = track;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    const chips = document.querySelectorAll('.filter-chip');
    if (track === null) chips[0].classList.add('active');
    else chips.forEach(c => { if (c.textContent === track) c.classList.add('active'); });
    render();
  }

  const grid = document.getElementById('termGrid');
  const noResults = document.getElementById('noResults');
  const countLabel = document.getElementById('countLabel');
  const searchBox = document.getElementById('searchBox');

  function render(){
    const q = searchBox.value.trim().toLowerCase();
    const filtered = TERMS.filter(x => {
      const matchesTrack = !activeFilter || x.track === activeFilter;
      const matchesSearch = !q || x.t.toLowerCase().includes(q) || x.def.toLowerCase().includes(q);
      return matchesTrack && matchesSearch;
    });
    grid.innerHTML = '';
    countLabel.textContent = `${filtered.length} of ${TERMS.length} terms`;
    noResults.style.display = filtered.length === 0 ? 'block' : 'none';
    filtered.forEach(x => {
      const el = document.createElement('div');
      el.className = 'term';
      el.innerHTML = `
        <div class="term-head">
          <span class="term-name">${x.t}</span>
          <span class="term-track">${x.track}</span>
        </div>
        <div class="term-def">${x.def}</div>
        <div class="term-day">${x.day}</div>
      `;
      grid.appendChild(el);
    });
  }

  searchBox.addEventListener('input', render);
  render();
</script>

</body>
</html>
