<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<title>Glosario FDE</title>
<style>
  :root{
    --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e9e7; --ink:#1a232b; --muted:#5c6b73;
    --border:#d3dbdd; --accent:#b8681f; --accent-ink:#fff8f0; --accent2:#256d87; --good:#3f7d52;
    --font-display: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161c; --surface:#171f28; --surface-2:#1c2530; --ink:#e6ecef; --muted:#93a3ac;
      --border:#2a3540; --accent:#e0964e; --accent-ink:#171208; --accent2:#6db8d6; --good:#63b37c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161c; --surface:#171f28; --surface-2:#1c2530; --ink:#e6ecef; --muted:#93a3ac;
    --border:#2a3540; --accent:#e0964e; --accent-ink:#171208; --accent2:#6db8d6; --good:#63b37c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 31px, color-mix(in srgb, var(--border) 55%, transparent) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, color-mix(in srgb, var(--border) 55%, transparent) 32px),
      var(--bg);
    color:var(--ink); font-family:var(--font-body); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent2);}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 24px 100px;}
  .backlink{font-family:var(--font-mono); font-size:12px; text-decoration:none; color:var(--muted); display:inline-flex; gap:6px;}
  .backlink:hover{color:var(--accent2);}
  header.masthead{border-bottom:1px solid var(--border); padding-bottom:24px; margin:18px 0 28px;}
  .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent2); display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:""; width:20px; height:1px; background:var(--accent2); display:inline-block;}
  h1{font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4.5vw,38px); margin:10px 0 8px; text-wrap:balance; letter-spacing:-0.01em;}
  .sub{color:var(--muted); font-size:15px; max-width:60ch;}

  .controls{position:sticky; top:0; background:var(--bg); padding:14px 0; z-index:10; border-bottom:1px solid var(--border); margin-bottom:20px;}
  .search-box{
    width:100%; font-family:var(--font-mono); font-size:14px; padding:10px 14px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); border-radius:2px; margin-bottom:10px;
  }
  .filter-row{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-chip{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:5px 11px;
    border-radius:2px; cursor:pointer;
  }
  .filter-chip:hover{border-color:var(--accent2);}
  .filter-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .count-label{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-bottom:14px;}

  .term-grid{display:flex; flex-direction:column; gap:0;}
  .term{border-bottom:1px solid var(--border); padding:16px 0;}
  .term:last-child{border-bottom:none;}
  .term-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .term-name{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .term-track{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent2); border:1px solid var(--accent2); padding:2px 8px; border-radius:2px; white-space:nowrap;}
  .term-def{font-size:14px; margin-top:6px; color:var(--ink);}
  .term-day{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:6px;}
  .no-results{font-family:var(--font-mono); font-size:13px; color:var(--muted); padding:30px 0; text-align:center;}

  .nav-footer{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:18px; margin-top:20px; font-family:var(--font-mono); font-size:12px;}
  .nav-footer a{text-decoration:none; border:1px solid var(--border); padding:7px 12px; border-radius:2px;}
  .nav-footer a:hover{border-color:var(--accent2);}
</style>
</head>
<body>


<div class="wrap">
  <a class="backlink" href="index.html">&larr; Volver al hub</a>

  <header class="masthead">
    <div class="eyebrow">Referencia · AI Agent Engineering Bootcamp</div>
    <h1>Glosario</h1>
    <p class="sub">Términos clave de los 14 días, en una sola página filtrable. Úsalo como repaso rápido, no como material de primera lectura.</p>
  </header>

  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Buscar un término... (ej. saga, oauth, rag)">
    <div class="filter-row" id="filterRow"></div>
  </div>

  <div class="count-label" id="countLabel"></div>
  <div class="term-grid" id="termGrid"></div>
  <div class="no-results" id="noResults" style="display:none;">Sin resultados — prueba otro término.</div>

  <div class="nav-footer">
    <a href="index.html">&larr; Hub</a>
    <span>Glosario · 40+ términos</span>
  </div>
</div>

<script>
  const TERMS = [
    {t:"LLM", track:"AI Agents", day:"Día 01", def:"Modelo que predice, token a token, el texto más probable dado un contexto. No tiene memoria entre llamadas — es stateless."},
    {t:"Prompting", track:"AI Agents", day:"Día 01", def:"System prompt = contrato de comportamiento (config). User prompt = el request puntual."},
    {t:"Structured Outputs", track:"AI Agents", day:"Día 01", def:"Forzar al modelo a devolver output que cumple un schema validable, en vez de texto libre."},
    {t:"Function / Tool Calling", track:"AI Agents", day:"Día 01", def:"El LLM propone {name, arguments}; el backend valida y decide si ejecutar. El modelo nunca ejecuta código directamente."},
    {t:"Agent", track:"AI Agents", day:"Día 01", def:"Un LLM dentro de un loop de control: decide, actúa (tool), observa, repite hasta responder."},
    {t:"RAG", track:"AI Agents", day:"Día 01", def:"Retrieval-Augmented Generation: consultar conocimiento en runtime en vez de entrenarlo en los pesos del modelo."},
    {t:"Embeddings", track:"AI Agents", day:"Día 01", def:"Representación vectorial de texto donde la distancia refleja similitud semántica."},
    {t:"Vector Database", track:"AI Agents", day:"Día 01", def:"Índice optimizado para búsqueda por vecino más cercano sobre embeddings."},
    {t:"Context Window", track:"AI Agents", day:"Día 01", def:"El presupuesto de tokens de un request: system prompt + historial + RAG + tool outputs compiten por ese espacio."},
    {t:"Hallucination", track:"AI Agents", day:"Día 01", def:"El modelo genera texto plausible pero falso, sin señal de error — el modo de falla más peligroso."},
    {t:"Guardrails", track:"AI Agents", day:"Día 01", def:"Middleware de validación de input/output alrededor del modelo: filtros, schema, límites de acción."},
    {t:"Agent Runtime", track:"AI Agents", day:"Día 02", def:"El proceso que orquesta el loop: arma contexto, llama al LLM, ejecuta tools, decide el siguiente paso."},
    {t:"Single-agent vs Multi-agent", track:"AI Agents", day:"Día 02", def:"Un agente con varias tools vs varios agentes especializados. Multi-agent se justifica por dominios heterogéneos con distintos scopes de seguridad."},
    {t:"OAuth2 / OIDC", track:"Integration", day:"Días 03-04", def:"OAuth2: autorización delegada. OIDC: capa de identidad sobre OAuth2. El scope del token debe reflejar exactamente el permiso del usuario."},
    {t:"API Gateway", track:"Integration", day:"Día 03", def:"Chokepoint central de auth, rate limiting y logging para todas las tool calls del agente."},
    {t:"Prompt Injection", track:"Security", day:"Día 04", def:"Instrucciones maliciosas ocultas en contenido externo (email, web) que intentan hijackear el comportamiento del agente."},
    {t:"Excessive Agency", track:"Security", day:"Día 04", def:"Darle al agente más permisos de los que la tarea requiere. Se previene con arquitectura, no con el prompt."},
    {t:"RBAC", track:"Security", day:"Día 04", def:"Las tools disponibles dependen del rol del usuario en cuyo nombre actúa el agente."},
    {t:"Human-in-the-loop", track:"Security", day:"Día 04", def:"Checkpoint de aprobación humana explícita para acciones irreversibles o de alto impacto."},
    {t:"Idempotency", track:"Reliability", day:"Días 05, 07", def:"Una operación puede ejecutarse más de una vez sin cambiar el resultado más allá de la primera ejecución — clave con retries."},
    {t:"Circuit Breaker", track:"Reliability", day:"Día 05", def:"Corta llamadas a una dependencia que falla repetidamente, forzando un fallback rápido."},
    {t:"Golden Set", track:"Reliability", day:"Día 05", def:"Set de casos de prueba fijos para detectar regresiones de un agente antes de deploy."},
    {t:"CAP Theorem", track:"Distributed Systems", day:"Día 07", def:"Durante una partición de red, hay que elegir entre consistencia y disponibilidad."},
    {t:"Saga", track:"Distributed Systems", day:"Día 07", def:"Patrón para acciones multi-paso sin transacción ACID única: cada paso tiene su compensating action si algo falla después."},
    {t:"Outbox Pattern", track:"Distributed Systems", day:"Día 07", def:"Escribir un evento en la misma transacción local que el cambio de estado, para publicarlo de forma confiable después."},
    {t:"Exactly-once vs At-least-once", track:"Distributed Systems", day:"Día 07", def:"Exactly-once real es casi imposible a nivel de red; se simula con at-least-once + idempotency."},
    {t:"Distributed Lock", track:"Distributed Systems", day:"Día 07", def:"Evita que dos ejecuciones concurrentes (ej. dos canales) modifiquen el mismo recurso al mismo tiempo."},
    {t:"Lambda vs ECS", track:"Cloud (AWS)", day:"Día 08", def:"Lambda para tools cortas y stateless. ECS/EKS para el Agent Runtime de larga duración con conexiones persistentes."},
    {t:"SQS vs Kafka", track:"Cloud (AWS)", day:"Día 08", def:"SQS para distribución de trabajo punto a punto. Kafka para múltiples consumidores independientes del mismo evento."},
    {t:"Step Functions", track:"Cloud (AWS)", day:"Día 08", def:"Orquestador de secuencias con retry y manejo de error por paso — el ajuste natural para implementar una Saga."},
    {t:"DynamoDB vs RDS", track:"Cloud (AWS)", day:"Día 08", def:"DynamoDB para estado de conversación (clave-valor, baja latencia). RDS para datos de negocio relacionales con joins."},
    {t:"Composition Case", track:"Interview Skills", day:"Día 09", def:"Caso de entrevista con un problema de negocio ambiguo; evalúa problem decomposition, no profundidad técnica."},
    {t:"System Design (16 pasos)", track:"Interview Skills", day:"Día 06", def:"Framework: Clarificar → Usuarios → Objetivos → Requisitos → Restricciones → Arquitectura → ... → Rollout."},
    {t:"Barge-in", track:"Voice", day:"Día 10", def:"Capacidad del usuario de interrumpir al agente mientras habla — crítico en canales de voz, irrelevante en chat."},
    {t:"CDRT Framework", track:"Communication", day:"Día 12", def:"Context → Decision → Reason → Trade-off → Result. Molde para explicar cualquier decisión técnica en 60-90s."},
    {t:"STAR + Architecture Context", track:"Behavioral", day:"Día 13", def:"Situation, Task, Action, Result, más el detalle técnico/arquitectónico específico de la decisión tomada."},
    {t:"MVP", track:"Product Thinking", day:"Día 11", def:"El subconjunto de scope de mayor valor y menor riesgo que se lanza primero, antes de comprometerse al alcance completo."},
    {t:"Least Privilege", track:"Security", day:"Días 04, 08", def:"Cada tool/rol tiene exactamente el permiso mínimo necesario para su función — nada más."},
    {t:"Backpressure", track:"Distributed Systems", day:"Día 07", def:"El sistema le dice al orquestador 'más despacio' cuando está sobrecargado, en vez de caerse."},
    {t:"Model Fallback", track:"Reliability", day:"Día 05", def:"Si el modelo primario falla o degrada, la arquitectura permite caer a un modelo/proveedor secundario."},
  ];

  const tracks = [...new Set(TERMS.map(x => x.track))];
  let activeFilter = null;

  const filterRow = document.getElementById('filterRow');
  const allChip = document.createElement('button');
  allChip.className = 'filter-chip active';
  allChip.textContent = 'Todos';
  allChip.addEventListener('click', () => setFilter(null));
  filterRow.appendChild(allChip);
  tracks.forEach(tr => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.textContent = tr;
    chip.addEventListener('click', () => setFilter(tr));
    filterRow.appendChild(chip);
  });

  function setFilter(track){
    activeFilter = track;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    const chips = document.querySelectorAll('.filter-chip');
    if (track === null) chips[0].classList.add('active');
    else chips.forEach(c => { if (c.textContent === track) c.classList.add('active'); });
    render();
  }

  const grid = document.getElementById('termGrid');
  const noResults = document.getElementById('noResults');
  const countLabel = document.getElementById('countLabel');
  const searchBox = document.getElementById('searchBox');

  function render(){
    const q = searchBox.value.trim().toLowerCase();
    const filtered = TERMS.filter(x => {
      const matchesTrack = !activeFilter || x.track === activeFilter;
      const matchesSearch = !q || x.t.toLowerCase().includes(q) || x.def.toLowerCase().includes(q);
      return matchesTrack && matchesSearch;
    });
    grid.innerHTML = '';
    countLabel.textContent = `${filtered.length} de ${TERMS.length} términos`;
    noResults.style.display = filtered.length === 0 ? 'block' : 'none';
    filtered.forEach(x => {
      const el = document.createElement('div');
      el.className = 'term';
      el.innerHTML = `
        <div class="term-head">
          <span class="term-name">${x.t}</span>
          <span class="term-track">${x.track}</span>
        </div>
        <div class="term-def">${x.def}</div>
        <div class="term-day">${x.day}</div>
      `;
      grid.appendChild(el);
    });
  }

  searchBox.addEventListener('input', render);
  render();
</script>

</body>
</html>
